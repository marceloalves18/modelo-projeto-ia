# Verificação no servidor a cada push ([R-VERIFICAR]): pega o que escapou de
# qualquer máquina — pre-commit não instalado, gitleaks ausente ou --no-verify.
name: verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o gitleaks varre o histórico inteiro

      - name: Instalar gitleaks (release oficial, com checksum)
        env:
          V: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep linux_x64.tar.gz "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Verificação completa
        run: scripts/verificar.sh
